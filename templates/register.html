{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-container">
    <h1>Регистрация</h1>
    <form method="POST" id="reg-form">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <input type="text" name="username" placeholder="Логин (3–20)" required>
        <input type="password" name="password" id="pass" placeholder="Пароль (мин. 8, буквы+цифры)" required>
        <div class="pass-strength" id="pass-strength"></div>
        <input type="password" name="confirm" placeholder="Повторите пароль" required>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</div>

<script>
    const pass = document.getElementById('pass');
    const out = document.getElementById('pass-strength');
    pass.addEventListener('input', () => {
        const v = pass.value;
        let score = 0;
        if (v.length >= 8) score++;
        if (/[A-Za-zА-Яа-я]/.test(v)) score++;
        if (/\d/.test(v)) score++;
        if (/[^A-Za-zА-Яа-я0-9]/.test(v)) score++;

        const labels = ['Очень слабый', 'Слабый', 'Средний', 'Хороший', 'Отличный'];
        const colors = ['#f4212e', '#f4212e', '#f59e0b', '#00ba7c', '#00ba7c'];
        out.textContent = v ? labels[score] : '';
        out.style.color = colors[score];
    });
</script>
{% endblock %}
