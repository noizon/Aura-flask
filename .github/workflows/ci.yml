name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1) Сборка: ставим зависимости и прогоняем тесты
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare upload dirs
        run: mkdir -p static/avatars static/posts

      - name: Run security tests
        run: python test_app.py

  # 2) Проверка: запускается ТОЛЬКО после успешного build
  check:
    name: Post-build Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare upload dirs
        run: mkdir -p static/avatars static/posts

      - name: Syntax check (all .py files)
        run: python -m compileall -q .

      - name: Validate Jinja templates
        run: |
          python - <<'EOF'
          import os, sys
          from jinja2 import Environment, FileSystemLoader

          env = Environment(loader=FileSystemLoader('templates'))
          bad = 0
          for f in sorted(os.listdir('templates')):
              if f.endswith('.html'):
                  try:
                      env.get_template(f)
                      print(f'OK   {f}')
                  except Exception as e:
                      print(f'FAIL {f}: {e}')
                      bad += 1
          sys.exit(1 if bad else 0)
          EOF

      - name: Import app (catches broken imports)
        run: |
          AURA_SECRET_KEY=ci-key python -c "import app; print('app imported OK')"

      - name: Run security tests again
        run: python test_app.py
